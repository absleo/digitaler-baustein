<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Digitaler Baustein</title>
    <meta name="keywords" content="Digitaler Baustein">
    <meta name="author" content="HTL Leonding, Absleo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- favicons begin -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/corporate-design/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/corporate-design/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/corporate-design/favicon/favicon-16x16.png">
    <link rel="manifest" href="./assets/corporate-design/favicon/site.webmanifest">
    <meta name="msapplication-TileColor" content="#216083">
    <!-- favicons end -->

    <style>
        @font-face {
            font-family: 'Manrope';
            src: url('assets/corporate-design/font/Manrope-Bold.ttf');
            font-display: fallback;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0b0b;
            color: #f2f2f2;
            font-family: 'Manrope', 'Segoe UI', sans-serif;
        }

        #split {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: inherit;
            text-decoration: none;
            font-weight: 700;
            font-size: 8vh;
            letter-spacing: 1vh;
        }

        .diamond {
            background: linear-gradient(135deg, #0f3a52, #0b0b0b);
            border-right: 1px solid #262626;
        }

        .gold {
            background: linear-gradient(135deg, #4a3d00, #0b0b0b);
        }
    </style>
</head>

<body>
    <div id="split">
        <a class="diamond" href="./diamond/">DIAMOND</a>
        <a class="gold" href="./gold/">GOLD</a>
    </div>
</body>

</html>
